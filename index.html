        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-page);

        #universeCanvas {

            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .cursor-spotlight {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;

            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: width 0.3s ease, height 0.3s ease;
        }

            font-weight: 800;
            font-family: var(--font-heading);
        }

        .brand-title {
            font-family: var(--font-heading);

            letter-spacing: -0.5px;
