<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resumora - High Precision ATS Resume Builder</title>
<meta name="description" content="100% ATS-compliant single and multi-page resume builder with crystal clear vector PDF download.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOPBAR -->
<header class="top no-print">
  <div class="brand">
    <div class="logo">R</div>
    <span>Resumora</span>
  </div>
  <div class="top-actions">
    <span class="stat" id="st">✓ Auto-saved</span>
    <button class="btn" id="reset" type="button" title="Reset to initial sample">↺ Reset Sample</button>
    <button class="btn p" id="print" type="button" title="Download High Resolution PDF">⬇ Download High-Def PDF</button>
  </div>
</header>

<!-- MAIN APP -->
<main class="app">
  <!-- LEFT EDITOR -->
  <aside class="no-print" id="ed">
    <div class="card">
      <h4>Template & Styling</h4>
      <label for="tpl">ATS Verified Templates</label>
      <select id="tpl">
        <option value="harvard">Harvard Classic (Ivy League Standard)</option>
        <option value="stanford">Stanford Modern (Clean Tech)</option>
        <option value="executive">Corporate Executive (Classic Serif)</option>
        <option value="minimalist">Tech Minimalist (Left-Aligned Clean)</option>
        <option value="split">Modern Split (Accent Bar)</option>
        <option value="compact">Compact Dense (High-Info Density)</option>
      </select>
      <label style="margin-top:10px;">Accent Theme Color</label>
      <div class="cols" id="cols"></div>
    </div>

    <div class="card">
      <h4>Contact & Identity</h4>
      <div class="g" id="basic"></div>
    </div>

    <div class="card">
      <h4>Professional Summary</h4>
      <textarea id="summary" rows="4" placeholder="Brief high-impact career summary..."></textarea>
    </div>

    <div id="lists"></div>

    <p class="print-tip">Tip: Print dialog me "Save as PDF" chunein aur "Headers and footers" ko unchecked rakhein.</p>
  </aside>

  <!-- RIGHT LIVE CANVAS -->
  <section class="prev">
    <article id="resume" class="resume t-harvard"></article>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
